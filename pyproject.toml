[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indonime"
version = "2.0.0"
description = "Subtitle Indonesia Anime Searcher - TUI application"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "cryptography>=49.0.0",
    "pywebview>=6.2.1",
    "tuiko>=0.1.3",
]

[project.scripts]
indonime = "indonime:main"

[project.urls]
Source = "https://github.com/salsabytes/indonime"

[tool.setuptools.packages.find]
include = ["indonime", "indonime.*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
