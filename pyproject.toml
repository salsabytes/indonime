[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indonime"
version = "1.5.0"
description = "Subtitle Indonesia Anime Searcher - TUI application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "InquirerPy",
    "rich",
    "cryptography",
]

[project.scripts]
indonime = "indonime:main"

[project.urls]
Source = "https://github.com/salsabytes/indonime"
